name: integration

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  qemu-integration:
    runs-on: ubuntu-latest
    # 4 hours.  The suite is 126 registered cases, most of which boot a full
    # QEMU guest and wait on serial output, so wall-clock time scales with
    # runner contention rather than with the size of the change being tested.
    # A timeout that merely fits today's suite turns every slow runner into a
    # spurious red build, and the failure mode is indistinguishable from a
    # real hang.  Four hours is a backstop against genuine deadlocks, not a
    # budget the suite is expected to approach.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check for Windows-reserved filenames
        run: |
          python3 - <<'EOF'
          import os, re, sys

          reserved = re.compile(r'^(CON|PRN|AUX|NUL|COM[0-9]|LPT[0-9])(\..+)?$', re.IGNORECASE)
          bad = []
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d != '.git']
              for name in files:
                  if reserved.match(name):
                      bad.append(os.path.join(root, name))

          if bad:
              print('Windows-reserved filenames found:')
              for path in bad:
                  print(' ', path)
              sys.exit(1)

          print('No Windows-reserved filenames.')
          EOF

      - name: Install build & QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld nasm xorriso qemu-system-x86 python3 make gcc llvm \
            mtools ovmf socat dosfstools e2fsprogs \
            autoconf automake libtool git

      # mingw-w64 is NOT in REQUIRED_TOOLS and the OS build does not need it:
      # the Makefile detects it and skips the Win32 examples when it is
      # absent.  But absent means test_w32_integration silently skips, and a
      # gate that quietly does nothing is worse than no gate -- so CI installs
      # it and the step below asserts the examples really were built.
      - name: Install mingw-w64 (Win32 personality examples)
        run: |
          sudo apt-get install -y --no-install-recommends mingw-w64
          x86_64-w64-mingw32-gcc --version | head -1

      - name: Install Rust bare-metal target
        run: |
          rustup target add x86_64-unknown-none
          rustc --target=x86_64-unknown-none --print target-libdir

      - name: Check build dependencies
        run: make deps-check

      - name: Build custom-loader ISO (default `make iso`)
        run: make iso

      - name: Run host unit tests (BL1 test_boot_info included)
        run: make test-unit

      # AUDIT_A5.  MATURITY_PLAN.md M3's remaining task was a grep-audit of
      # every user-pointer dereference -- the kind of sweep a human does
      # once and never repeats.  Written as a tool and run here instead, so
      # a new syscall that dereferences an argument without going through
      # copy_from_user/copy_to_user/validate_user_range fails the build.
      - name: User-pointer dereference audit
        run: python3 tools/audit_user_pointers.py --check

      # AUDIT_A7.  FIXES_PLAN.md said "PLANNED" while all 33 of its own
      # task boxes were ticked and every repair was in the tree -- the same
      # drift AUDIT_A3 found one document over.  Each phase is now tied to
      # the source, and the gates it promises must also be REGISTERED, not
      # merely present (an unregistered case does not run: see AUDIT_A0).
      - name: Fixes plan claim check
        run: python3 tools/check_fixes_claims.py --check

      # OPT_PLAN O9.  The optimization plan documents two of its own
      # phases whose first drafts were wrong in ways only measurement
      # caught (O1's rep-movsb placebo, O6's phantom target) -- so its
      # checkboxes are tied to the tree: every ✅ phase must name an
      # existing patch, its section must agree, the O0 measuring rig
      # must be present AND registered, and every counter the §6 ledger
      # quotes must still exist in perfstat.c.
      - name: Optimization plan claim check
        run: python3 tools/check_opt_claims.py --check

      # AUDIT_A3.  MATURITY_PLAN.md's phase statuses are prose, and prose
      # does not fail a build: M3 and M4 had landed while still listed
      # "pending", M6 understated tcp.c, and M10 asked for USB work that
      # USB_PLAN.md had already delivered.  Each status is now tied to
      # something in the source, absences included.
      - name: Maturity plan claim check
        run: python3 tools/check_maturity_claims.py --check

      # AUDIT_A0.  run_all.sh's case list is hand-maintained and had fallen
      # 27 cases behind tests/integration/cases/ -- a fifth of the suite,
      # including phase gates, that CI never ran while reporting all green.
      # Disagreement in either direction now fails the build.
      - name: Integration case registry check
        run: python3 tools/check_test_registry.py --check

      # USB_PLAN.md U9.  docs/usb.md states what the USB stack does and --
      # more importantly -- what it only approximates or does not do at all.
      # Both halves are checked against the drivers, so an absent feature
      # that quietly gets implemented, or a claim that quietly stops being
      # true, fails the build instead of rotting in the documentation.
      - name: USB documentation drift check
        run: python3 tools/check_usb_claims.py --check

      # WIN32_PLAN.md W32-8.  `make test-unit` already runs the provenance
      # selftest and the generated-API-table drift check; this step adds the
      # Win32 SDK, which is not part of the default build, and builds all
      # three examples AGAINST THE STAGED SDK rather than the source tree.
      - name: Win32 personality -- SDK and examples
        run: make w32-sdk-check

      # The Win32 examples must be in the ISO for test_w32_integration to do
      # anything.  The Makefile skips them silently when mingw-w64 is
      # missing, so assert here rather than discover a vacuous pass later.
      - name: Win32 personality -- examples are in the image
        run: |
          if ! tar tf build/initrd.tar | grep -q './tests/w32hello.exe'; then
            echo "w32hello.exe missing from the initrd: the mingw-w64"
            echo "examples were not built, so test_w32_integration would"
            echo "skip instead of testing anything."
            exit 1
          fi
          tar tf build/initrd.tar | grep -E 'w32hello|w32unsup|testdll'

      - name: BL2 -- MBR sanity + boot handoff
        run: bash tests/integration/bl2_mbr_smoke.sh

      - name: BL3 -- Stage 2 real-mode services
        run: bash tests/integration/bl3_stage2_smoke.sh

      - name: BL4 -- FAT32 reader
        run: bash tests/integration/bl4_fat_smoke.sh

      - name: BL4 -- ELF loader
        run: bash tests/integration/bl4_elf_smoke.sh

      - name: BL4 -- full BIOS boot to kernel banner
        run: bash tests/integration/bl4_boot_smoke.sh

      - name: BL5 -- BIOS-only hybrid ISO
        run: bash tests/integration/bl5_iso_smoke.sh

      - name: BL6 -- UEFI BOOTX64.EFI via OVMF
        run: bash tests/integration/bl6_uefi_smoke.sh

      - name: BL7 -- dual-boot ISO (BIOS + UEFI in one file)
        run: bash tests/integration/bl7_dual_smoke.sh

      # DOOM_PLAN.md D4/D6.  Called out as its own step rather than left to
      # `make test-integration` below, because it guards a defect class that
      # nothing else in the suite reaches: ahci_read() leaked a DMA bounce
      # buffer per transfer, which truncated EVERY file on an AHCI-backed
      # filesystem past ~10 MB.  It stayed invisible for the life of the
      # driver because no test read a file that large.  Needs no WAD and no
      # download, so it runs on every push.
      - name: AHCI + FAT32 large-file read (the 173824-byte regression)
        run: bash tests/integration/cases/test_ahci_large_read.sh
        env:
          NO_COLOR: "1"

      # The 129-case suite used to run HERE as one ~2 h step; it now
      # runs as six parallel thematic shards in the integration-cases
      # matrix job below (measured 2 h 08 m at the last single-job
      # run -- longer than every other job combined).  What stays in
      # THIS job is the partition check: every registered case must
      # belong to exactly one shard, so a new case cannot silently
      # drop out of CI (the AUDIT_A0 disease, 27 cases never run,
      # does not get a second chapter).  run_all.sh re-checks this on
      # every invocation as well; this step just makes the refusal a
      # named line in the log.
      - name: Integration shard partition check
        run: bash tests/integration/run_all.sh --check-groups

      - name: Upload serial logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: |
            build/integration-logs/
            build/bl*.log
            build/bl*.mem
          if-no-files-found: ignore

  # The 129 QEMU integration cases, split into six THEMATIC SHARDS
  # running in parallel (2026-08-21; the user-visible win: ~2 h of
  # wall clock becomes the slowest shard's ~25 min).  The partition
  # lives in run_all.sh next to the case list and is self-checked on
  # every invocation -- see the partition-check step above.
  # fail-fast is off: one shard's failure must not cancel the others,
  # or a bad net case would hide a good usb run's evidence.
  integration-cases:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        group: [core, posix, fs, usb, net, gui]
    steps:
      - uses: actions/checkout@v4

      - name: Install build & QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld nasm xorriso qemu-system-x86 python3 make gcc llvm \
            mtools ovmf socat dosfstools e2fsprogs \
            autoconf automake libtool git

      # The gui shard carries the six w32 gates; mingw builds their
      # example binaries.  Installed for every shard (uniform steps
      # beat per-shard special cases; +15 s).
      - name: Install mingw-w64
        run: |
          sudo apt-get install -y --no-install-recommends \
            mingw-w64 mingw-w64-tools

      - name: Install Rust bare-metal target
        run: |
          rustup target add x86_64-unknown-none
          rustc --version

      - name: Build the ISO
        run: |
          make deps-check
          make iso

      - name: Run the ${{ matrix.group }} shard
        run: bash tests/integration/run_all.sh --group ${{ matrix.group }}
        env:
          NO_COLOR: "1"

      # results-<group>.txt names every case PASS/FAIL with duration:
      # step stdout is admin-only on public repos, and serial logs
      # alone cannot say which case failed (measured the hard way
      # while chasing the first matrix runs).
      - name: Upload shard logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs-${{ matrix.group }}
          path: |
            build/integration-logs/
          if-no-files-found: ignore

  # DOOM_PLAN.md D6.  A SEPARATE job, and deliberately not part of the gate
  # above.
  #
  # It clones a GPL-2.0 engine and downloads a 22 MB IWAD, so it depends on
  # two third-party endpoints that the rest of the build does not.  Making
  # every push depend on them would mean an outage at either one turns the
  # whole repository red for a reason unrelated to the change being tested.
  #
  # continue-on-error keeps that isolation honest: this job reports, it does
  # not block.  The libc work DOOM prompted is covered for free by
  # `make test-unit` in the job above, and the kernel work by the AHCI step.
  doom:
    runs-on: ubuntu-latest
    # Raised to 4 hours alongside the main gate.  This job clones an engine
    # and downloads a 22 MB IWAD, so it is the most likely to stall on a slow
    # third-party endpoint; continue-on-error means a stall here reports but
    # never blocks the repository.
    timeout-minutes: 240
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install build & QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld nasm xorriso qemu-system-x86 python3 make gcc llvm \
            mtools ovmf dosfstools e2fsprogs git curl unzip

      - name: Install Rust bare-metal target
        run: |
          rustup target add x86_64-unknown-none
          rustc --version

      # Fetches doomgeneric and Freedoom into build/ and builds the WAD disk.
      # The engine is GPL-2.0 and is never committed to this repository
      # (DOOM_PLAN.md D1); this step is where it enters the build.
      - name: Build the DOOM port and its WAD disk
        run: make build/doom/doomdisk.img

      - name: Build the ISO
        run: make iso

      # Skips loudly and exits 0 if either input is missing, so a failed
      # fetch is reported as a skip rather than as a broken port.
      - name: DOOM end-to-end (UEFI + Freedoom)
        run: bash tests/integration/cases/test_doom.sh
        env:
          NO_COLOR: "1"

      - name: Upload serial logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doom-logs
          path: build/integration-logs/
          if-no-files-found: ignore

  # I386_PLAN I9: the 32-bit architecture job.  Builds the same `make iso`
  # image (which already carries KERNEL32.ELF) and runs the i386 smoke
  # family under qemu-system-i386, plus the host-side width gates.  A
  # separate job rather than steps in qemu-integration so an i386 red is
  # attributable at a glance -- the two kernels share contracts, not
  # artefacts, and their failures deserve separate lines in the matrix.
  i386-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Install build & QEMU dependencies (i386 target included)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld nasm qemu-system-x86 python3 make gcc llvm \
            mtools dosfstools gcc-multilib git
          # qemu-system-x86 ships qemu-system-i386 on Debian/Ubuntu;
          # assert rather than assume:
          qemu-system-i386 --version

      - name: Install Rust bare-metal target
        run: |
          rustup target add x86_64-unknown-none
          rustc --version

      - name: Build the dual-kernel ISO
        run: |
          make deps-check
          make iso

      - name: KERNEL32.ELF is in the image
        run: |
          mdir -i "build/auralite.iso@@$((256 * 512))" ::/ | grep -i KERNEL32
        shell: bash

      - name: Width-sweep ratchets + boot_info cross-width contract
        run: bash tests/unit/test_width_sweep.sh

      - name: Crypto vectors at 32-bit width (-m32)
        run: bash tests/unit/test_libatls_m32.sh

      - name: I386_PLAN claim check
        run: |
          python3 tools/check_i386_claims.py
          python3 tools/check_i386_claims.py --selftest

      - name: I0 -- refusal on a long-mode-less CPU
        run: bash tests/integration/i386_refusal_smoke.sh

      - name: I1 -- dual-kernel boot chain
        run: bash tests/integration/i386_boot32_smoke.sh

      - name: I2 -- CPU bring-up (GDT/IDT/PIC/PIT, named exceptions)
        run: bash tests/integration/i386_cpu_smoke.sh

      - name: I3 -- memory (PSE paging, PMM, heap)
        run: bash tests/integration/i386_mm_smoke.sh

      - name: I4 -- processes (scheduler, Ring 3, int 0x80)
        run: bash tests/integration/i386_proc_smoke.sh

      - name: I5 -- userspace (initrd, ELF32, init32)
        run: bash tests/integration/i386_user_smoke.sh

      - name: I7 -- interactive shell (auralite#)
        run: bash tests/integration/i386_shell_smoke.sh

      - name: I8 -- storage + network parity
        run: bash tests/integration/i386_parity_smoke.sh

      - name: Upload serial logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: i386-serial-logs
          path: |
            build/i386_*.log
          if-no-files-found: ignore

  # RISCV_PLAN V9: the third architecture on every push.  A separate
  # job for the same reason i386-parity is one: a red X must name its
  # architecture without anyone reading logs.
  riscv-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install build & QEMU dependencies (riscv64 target included)
        run: |
          sudo apt-get update
          # NO gcc-multilib here: gcc-N-riscv64-linux-gnu declares
          # Conflicts: gcc-multilib (measured -- the first local run of
          # this job's package list failed the apt solver).  The -m32
          # crypto gate lives in the i386-parity job, which installs
          # multilib and NOT the cross gcc; each width gets its own
          # toolchain in its own job and the conflict never meets.
          sudo apt-get install -y --no-install-recommends \
            clang lld nasm qemu-system-x86 qemu-system-misc qemu-user \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross \
            python3 make gcc llvm \
            mtools dosfstools xorriso git
          # qemu-system-misc ships qemu-system-riscv64 on Debian/Ubuntu;
          # assert rather than assume:
          qemu-system-riscv64 --version

      # [AMEND-6], back-ported to the job that taught the lesson: the
      # first four-job matrix run FAILED here because the runner image
      # stopped pulling the cross libc transitively -- the exact
      # "Setting up printed, binary absent" mechanism, string.h
      # edition.  libc6-dev-riscv64-cross is now named above, and this
      # step asserts existence AFTER install.
      - name: Assert the cross toolchain actually exists (AMEND-6)
        run: |
          command -v riscv64-linux-gnu-gcc
          command -v qemu-riscv64
          test -e /usr/riscv64-linux-gnu/include/string.h

      - name: Install Rust bare-metal target
        run: |
          rustup target add x86_64-unknown-none
          rustc --version

      - name: Build the rv64 kernel and userspace
        run: |
          make kernelrv
          make userrv

      - name: Build the shared initrd (three tenants) + ISO
        run: |
          make deps-check
          make iso

      # The KERNEL32-in-the-image lesson, third verse: a build that
      # silently dropped the rv64 tenant would let every later gate
      # "pass" against stale artefacts.  Assert presence first.
      - name: /binrv is in the shared initrd
        run: |
          tar tf build/initrd.tar | grep '\./binrv/init'
          tar tf build/initrd.tar | grep '\./binrv/smallsh'
          test -s build/kernelrv.elf

      - name: Width-sweep ratchets (incl. ratchet 4) + third-width contract
        run: bash tests/unit/test_width_sweep.sh

      - name: Crypto vectors EXECUTED at rv64 (the complete suite)
        run: bash tests/unit/test_libatls_rv64.sh

      - name: RISCV_PLAN claim check
        run: |
          python3 tools/check_riscv_claims.py
          python3 tools/check_riscv_claims.py --selftest

      - name: V0-V5 -- the boot gauntlet (46 assertions)
        run: bash tests/integration/rv_boot_smoke.sh

      - name: V5+V7 -- the interactive shell over PLIC input
        run: bash tests/integration/rv_shell_smoke.sh

      - name: V8 -- the parity boot (every gate, one run, x86 pair)
        run: bash tests/integration/rv_parity_smoke.sh

      - name: Upload serial logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: riscv-serial-logs
          path: |
            build/rv_*.log
          if-no-files-found: ignore

  aarch64-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install build & QEMU dependencies (aarch64 target included)
        run: |
          sudo apt-get update
          # NO gcc-multilib here and NO riscv cross-gcc either: the
          # riscv job measured the Conflicts field the hard way, and
          # the same job-separation rule applies -- each width gets
          # its own toolchain in its own job and the conflict never
          # meets.  libc6-dev-arm64-cross is named EXPLICITLY: the
          # cross gcc alone does not pull the target libc (ARM64_PLAN
          # Fact 1 -- the static crypto gate would die at <string.h>).
          sudo apt-get install -y --no-install-recommends \
            clang lld nasm qemu-system-x86 qemu-system-arm qemu-user \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            python3 make gcc llvm \
            mtools dosfstools xorriso git

      # [AMEND-6] Assert the tools EXIST after install -- the OPT
      # audit's environment lost a cross-gcc to silent apt dependency
      # failures three times ("Setting up" printed, binary absent).
      # An installer's exit status is not a binary's existence.
      - name: Assert the cross toolchain actually exists (AMEND-6)
        run: |
          command -v aarch64-linux-gnu-gcc
          command -v qemu-aarch64
          qemu-system-aarch64 --version
          test -e /usr/aarch64-linux-gnu/include/string.h

      - name: Install Rust bare-metal target
        run: |
          rustup target add x86_64-unknown-none
          rustc --version

      - name: Build the aarch64 kernel, userspace and Image
        run: |
          make kernela64
          make usera64
          make kernela64-img

      - name: Build the shared initrd (four tenants) + ISO
        run: |
          make deps-check
          make iso

      # The KERNEL32-in-the-image lesson, fourth verse: a build that
      # silently dropped the a64 tenant would let every later gate
      # "pass" against stale artefacts.  Assert presence first.
      - name: /bina64 is in the shared initrd
        run: |
          tar tf build/initrd.tar | grep '\./bina64/init'
          tar tf build/initrd.tar | grep '\./bina64/smallsh'
          test -s build/kernela64.elf
          test -s build/kernela64.img

      - name: Width-sweep ratchets + the fourth width and its lanes
        run: bash tests/unit/test_width_sweep.sh

      - name: Crypto vectors EXECUTED at aarch64 (the complete suite)
        run: bash tests/unit/test_libatls_a64.sh

      - name: ARM64_PLAN claim check
        run: |
          python3 tools/check_arm64_claims.py
          python3 tools/check_arm64_claims.py --selftest

      - name: A0-A4 -- the boot gauntlet (ELF path)
        run: bash tests/integration/a64_boot_smoke.sh

      - name: A5a -- the Image boot protocol (x0 DTB + initrd bytes)
        run: bash tests/integration/a64_image_smoke.sh

      - name: A5c -- the interactive shell at EL0 (fuse armed)
        run: bash tests/integration/a64_shell_smoke.sh

      - name: A7 -- blk + net over the promoted transport, IRQ console
        run: bash tests/integration/a64_drivers_smoke.sh

      - name: A8 -- the parity boot (every gate, one run, x86 pair)
        run: bash tests/integration/a64_parity_smoke.sh

      - name: Upload serial logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aarch64-serial-logs
          path: |
            build/a64_*.log
          if-no-files-found: ignore
