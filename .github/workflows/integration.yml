name: integration

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  qemu-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check for Windows-reserved filenames
        run: |
          python3 - <<'EOF'
          import os, re, sys

          reserved = re.compile(r'^(CON|PRN|AUX|NUL|COM[0-9]|LPT[0-9])(\..+)?$', re.IGNORECASE)
          bad = []
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d != '.git']
              for name in files:
                  if reserved.match(name):
                      bad.append(os.path.join(root, name))

          if bad:
              print('Windows-reserved filenames found:')
              for path in bad:
                  print(' ', path)
              sys.exit(1)

          print('No Windows-reserved filenames.')
          EOF

      - name: Install build & QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld nasm xorriso qemu-system-x86 python3 make gcc llvm \
            mtools ovmf socat dosfstools e2fsprogs \
            autoconf automake libtool git

      # mingw-w64 is NOT in REQUIRED_TOOLS and the OS build does not need it:
      # the Makefile detects it and skips the Win32 examples when it is
      # absent.  But absent means test_w32_integration silently skips, and a
      # gate that quietly does nothing is worse than no gate -- so CI installs
      # it and the step below asserts the examples really were built.
      - name: Install mingw-w64 (Win32 personality examples)
        run: |
          sudo apt-get install -y --no-install-recommends mingw-w64
          x86_64-w64-mingw32-gcc --version | head -1

      - name: Install Rust bare-metal target
        run: |
          rustup target add x86_64-unknown-none
          rustc --target=x86_64-unknown-none --print target-libdir

      - name: Check build dependencies
        run: make deps-check

      - name: Build custom-loader ISO (default `make iso`)
        run: make iso

      - name: Run host unit tests (BL1 test_boot_info included)
        run: make test-unit

      # AUDIT_A0.  run_all.sh's case list is hand-maintained and had fallen
      # 27 cases behind tests/integration/cases/ -- a fifth of the suite,
      # including phase gates, that CI never ran while reporting all green.
      # Disagreement in either direction now fails the build.
      - name: Integration case registry check
        run: python3 tools/check_test_registry.py --check

      # USB_PLAN.md U9.  docs/usb.md states what the USB stack does and --
      # more importantly -- what it only approximates or does not do at all.
      # Both halves are checked against the drivers, so an absent feature
      # that quietly gets implemented, or a claim that quietly stops being
      # true, fails the build instead of rotting in the documentation.
      - name: USB documentation drift check
        run: python3 tools/check_usb_claims.py --check

      # WIN32_PLAN.md W32-8.  `make test-unit` already runs the provenance
      # selftest and the generated-API-table drift check; this step adds the
      # Win32 SDK, which is not part of the default build, and builds all
      # three examples AGAINST THE STAGED SDK rather than the source tree.
      - name: Win32 personality -- SDK and examples
        run: make w32-sdk-check

      # The Win32 examples must be in the ISO for test_w32_integration to do
      # anything.  The Makefile skips them silently when mingw-w64 is
      # missing, so assert here rather than discover a vacuous pass later.
      - name: Win32 personality -- examples are in the image
        run: |
          if ! tar tf build/initrd.tar | grep -q './tests/w32hello.exe'; then
            echo "w32hello.exe missing from the initrd: the mingw-w64"
            echo "examples were not built, so test_w32_integration would"
            echo "skip instead of testing anything."
            exit 1
          fi
          tar tf build/initrd.tar | grep -E 'w32hello|w32unsup|testdll'

      - name: BL2 -- MBR sanity + boot handoff
        run: bash tests/integration/bl2_mbr_smoke.sh

      - name: BL3 -- Stage 2 real-mode services
        run: bash tests/integration/bl3_stage2_smoke.sh

      - name: BL4 -- FAT32 reader
        run: bash tests/integration/bl4_fat_smoke.sh

      - name: BL4 -- ELF loader
        run: bash tests/integration/bl4_elf_smoke.sh

      - name: BL4 -- full BIOS boot to kernel banner
        run: bash tests/integration/bl4_boot_smoke.sh

      - name: BL5 -- BIOS-only hybrid ISO
        run: bash tests/integration/bl5_iso_smoke.sh

      - name: BL6 -- UEFI BOOTX64.EFI via OVMF
        run: bash tests/integration/bl6_uefi_smoke.sh

      - name: BL7 -- dual-boot ISO (BIOS + UEFI in one file)
        run: bash tests/integration/bl7_dual_smoke.sh

      # DOOM_PLAN.md D4/D6.  Called out as its own step rather than left to
      # `make test-integration` below, because it guards a defect class that
      # nothing else in the suite reaches: ahci_read() leaked a DMA bounce
      # buffer per transfer, which truncated EVERY file on an AHCI-backed
      # filesystem past ~10 MB.  It stayed invisible for the life of the
      # driver because no test read a file that large.  Needs no WAD and no
      # download, so it runs on every push.
      - name: AHCI + FAT32 large-file read (the 173824-byte regression)
        run: bash tests/integration/cases/test_ahci_large_read.sh
        env:
          NO_COLOR: "1"

      # `make test-integration` runs every case in
      # tests/integration/run_all.sh, which includes all six Win32 gates:
      # test_w32_pe_loader, _kernel32, _user32, _crt, _loadlibrary and
      # _integration.  They add roughly 9 minutes to this job (70-120s each,
      # measured), which the 120-minute timeout absorbs comfortably.
      - name: Run QEMU integration tests
        run: make test-integration
        env:
          NO_COLOR: "1"

      - name: Upload serial logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: |
            build/integration-logs/
            build/bl*.log
            build/bl*.mem
          if-no-files-found: ignore

  # DOOM_PLAN.md D6.  A SEPARATE job, and deliberately not part of the gate
  # above.
  #
  # It clones a GPL-2.0 engine and downloads a 22 MB IWAD, so it depends on
  # two third-party endpoints that the rest of the build does not.  Making
  # every push depend on them would mean an outage at either one turns the
  # whole repository red for a reason unrelated to the change being tested.
  #
  # continue-on-error keeps that isolation honest: this job reports, it does
  # not block.  The libc work DOOM prompted is covered for free by
  # `make test-unit` in the job above, and the kernel work by the AHCI step.
  doom:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install build & QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld nasm xorriso qemu-system-x86 python3 make gcc llvm \
            mtools ovmf dosfstools e2fsprogs git curl unzip

      - name: Install Rust bare-metal target
        run: |
          rustup target add x86_64-unknown-none
          rustc --version

      # Fetches doomgeneric and Freedoom into build/ and builds the WAD disk.
      # The engine is GPL-2.0 and is never committed to this repository
      # (DOOM_PLAN.md D1); this step is where it enters the build.
      - name: Build the DOOM port and its WAD disk
        run: make build/doom/doomdisk.img

      - name: Build the ISO
        run: make iso

      # Skips loudly and exits 0 if either input is missing, so a failed
      # fetch is reported as a skip rather than as a broken port.
      - name: DOOM end-to-end (UEFI + Freedoom)
        run: bash tests/integration/cases/test_doom.sh
        env:
          NO_COLOR: "1"

      - name: Upload serial logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doom-logs
          path: build/integration-logs/
          if-no-files-found: ignore
